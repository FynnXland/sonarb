name: sonarb
description: "Fahrerassistenz: feste Messstellen aus OpenStreetMap, eigene Hotspots, optionale Plugins."
publish_to: 'none'
version: 1.0.0+22
environment:
  sdk: ^3.13.3

dependencies:
  audio_session: ^0.2.4
  crypto: ^3.0.8
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  geolocator: ^14.0.1
  http: ^1.6.0
  just_audio: ^0.10.6
  latlong2: ^0.10.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
